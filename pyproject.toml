[project]
name = "argosuy"
version = "0.1.0"
description = "ArgosUY is an open-source platform that indexes the GitHub ecosystem of Uruguay, users, organizations, repositories, and individual commits, stores it in ClickHouse, and exposes a FastAPI backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=1.1.1",
    "dbwarden>=0.7",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "pandas>=3.0.3",
    "prefect>=3.7.3",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
    "uvicorn>=0.49.0",
]
